# LDO CSR register map -- source of truth.
#
# Contract (CONTRACT.md section 7):
#   0x00 CTRL.EN[0]     RW, reset 0
#   0x04 STATUS.PGOOD[0] RO, live status (not a storage register)
#
# The `ro` bit field type is what makes PGOOD a live status: the installed
# rggen-systemverilog 0.36.0 expands `ro` to
#   rggen_bit_field #(.STORAGE(0), .EXTERNAL_READ_DATA(1)) ... .i_value (i_<...>)
# so a read returns the current value of a hardware input port instead of a
# registered copy. Visible in the generated RTL (rtl/generated/rggen/ldo_csr.sv).
register_blocks:
  - name: ldo_csr
    byte_size: 8
    registers:
      - name: ctrl
        offset_address: 0x00
        bit_fields:
          - name: en
            bit_assignment: { width: 1, lsb: 0 }
            type: rw
            initial_value: 0
      - name: status
        offset_address: 0x04
        bit_fields:
          - name: pgood
            bit_assignment: { width: 1, lsb: 0 }
            type: ro
