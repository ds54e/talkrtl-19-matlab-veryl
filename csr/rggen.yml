# RgGen configuration for the LDO CSR.
#
# Confirmed against the installed RgGen (rggen 0.36.1 / rggen-systemverilog 0.36.0):
#   rggen --help            -> -c/--configuration, -o/--output, --enable WRITER
#   rggen --verbose-version -> rggen-core 0.36.1, rggen-sv-rtl 0.36.0
# Writer component names come from the installed gems, not from memory:
#   sv_rtl / sv_rtl_package / sv_ral (rggen-systemverilog 0.36.0)
# The `sv_ral` writer is deliberately not enabled: only the RTL writer is used.
bus_width: 32
address_width: 8
protocol: apb
